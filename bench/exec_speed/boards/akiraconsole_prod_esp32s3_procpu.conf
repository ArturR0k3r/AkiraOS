# exec_speed — ESP32-S3 board config for the AOT variant (auto-merged by Zephyr
# for board akiraconsole_prod/esp32s3/procpu). Active only when built with
# -Dexec_speed_EXEC_SPEED_AOT=y; harmless (PSRAM just unused) otherwise.
#
# AOT native code must live in executable memory. On ESP32-S3 the WAMR Zephyr
# platform (zephyr_platform.c os_mmap -> aot_exec_alloc) allocates it from the
# shared-multi-heap EXTERNAL region (PSRAM), writes/relocates it through the
# data-bus mirror, and executes it via the instruction-bus alias. That requires
# PSRAM + the shared multi heap + PSRAM instruction fetch — the same options the
# production board uses (snippets/akira-reference/.../akiraconsole_prod*.conf).

# ── PSRAM (ESP32-S3-WROOM-1-N16R8: 8 MB OPI PSRAM) ──────────────────────────
CONFIG_ESP_SPIRAM=y
CONFIG_ESP_SPIRAM_SIZE=8388608
CONFIG_ESP_SPIRAM_HEAP_SIZE=4194304
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_SPIRAM_TYPE_ESPPSRAM64=y
CONFIG_SPIRAM_SPEED_80M=y
CONFIG_MEMC=y
# Map PSRAM into the instruction bus so AOT code can be fetched/executed from it.
CONFIG_SPIRAM_RODATA=y
CONFIG_SPIRAM_FETCH_INSTRUCTIONS=y
CONFIG_ESP_SPIRAM_MEMTEST=n

# ── Shared multi heap: the SoC layer registers PSRAM as SMH_REG_ATTR_EXTERNAL
#    (zephyr/soc/espressif/common/esp_psram.c), which aot_exec_alloc() draws from.
CONFIG_SHARED_MULTI_HEAP=y
