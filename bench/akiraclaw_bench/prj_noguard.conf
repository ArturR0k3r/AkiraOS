# akiraclaw_bench — B1 wasm_noguard variant
# Disables the capability gate system so AKIRA_CHECK_CAP_OR_RETURN
# compiles to a true no-op.  This gives the zero-overhead WASM baseline
# for the CG cost comparison (wasm_noguard vs wasm_claw).
#
# WARNING: CONFIG_AKIRA_CAPABILITY_SYSTEM=n implies CONFIG_AKIRA_SANDBOX=n
# (sandbox depends on CG).  Do not use this config for production.
#
# Usage:
#   west build -b akiraconsole/esp32s3/procpu bench/akiraclaw_bench \
#       -- -DCONF_FILE=prj_noguard.conf -DCONFIG_BENCH_WASM_NOGUARD=y

CONFIG_AKIRA_WASM_RUNTIME=y
CONFIG_AKIRA_AIINFER=y
CONFIG_AKIRA_TFLITE_MICRO=y
CONFIG_AKIRA_TFLITE_ESPNN=y
CONFIG_AKIRA_AIINFER_ARENA_KB=128
CONFIG_AKIRA_AIINFER_MAX_HANDLES=2
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_AKIRA_LOG_LEVEL=3
CONFIG_BT=n
CONFIG_MP_MAX_NUM_CPUS=2
CONFIG_SCHED_CPU_MASK=y
CONFIG_MAX_CONTAINERS=2
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_FILE_SYSTEM=y
CONFIG_CPP=y
CONFIG_STD_CPP14=y
CONFIG_GLIBCXX_LIBCPP=y

# ── CG disabled — WASM API cap checks become unconditional pass ──────────
CONFIG_AKIRA_CAPABILITY_SYSTEM=n
# AKIRA_SANDBOX and AKIRA_SECURITY_AUDIT both depend on CAPABILITY_SYSTEM
# and will be automatically disabled.

# Expose the noguard WASM binary in bench_b1_wasm.c
CONFIG_BENCH_WASM_NOGUARD=y
