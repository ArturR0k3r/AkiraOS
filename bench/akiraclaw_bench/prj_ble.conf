# akiraclaw_bench — B5 BLE coexistence variant
# Enables BLE advertising while running aiinfer_run in a tight loop.
# Measures inference latency variance and missed advertising events.
#
# Usage:
#   west build -b akiraconsole/esp32s3/procpu bench/akiraclaw_bench \
#       -- -DCONF_FILE=prj_ble.conf

CONFIG_AKIRA_WASM_RUNTIME=y
CONFIG_AKIRA_AIINFER=y
CONFIG_AKIRA_TFLITE_MICRO=y
CONFIG_AKIRA_TFLITE_ESPNN=y
CONFIG_AKIRA_AIINFER_ARENA_KB=128
CONFIG_AKIRA_AIINFER_MAX_HANDLES=2
CONFIG_AKIRA_CAPABILITY_SYSTEM=y
CONFIG_AKIRA_SANDBOX=y
CONFIG_AKIRA_SANDBOX_EXEC_TIMEOUT_MS=30000
CONFIG_AKIRA_SANDBOX_RATE_LIMITING=n
CONFIG_AKIRA_SECURITY_AUDIT=y
CONFIG_AKIRA_AUDIT_LOG_SIZE=64
CONFIG_AKIRA_AUDIT_LOG_HMAC=n
CONFIG_AKIRA_PSRAM=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_AKIRA_LOG_LEVEL=3
CONFIG_MP_MAX_NUM_CPUS=2
CONFIG_SCHED_CPU_MASK=y
CONFIG_MAX_CONTAINERS=2
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_FILE_SYSTEM=y
CONFIG_CPP=y
CONFIG_STD_CPP14=y
CONFIG_GLIBCXX_LIBCPP=y

# ── BLE ───────────────────────────────────────────────────────────────────
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="akiraclaw_bench"
CONFIG_BT_MAX_CONN=1

# BT host stack heap — must accommodate adv + connection state
CONFIG_BT_BUF_ACL_TX_COUNT=4
CONFIG_BT_BUF_ACL_RX_COUNT=4

# ESP32-S3 BLE controller uses the IDF BT stack via Zephyr shim
CONFIG_ESP_HEAP_MEM_POOL_REGION_1_SIZE=0
