# akiraclaw_bench — B3 HMAC variant
# Enable HMAC-SHA256 signing of audit entries.
# Compare audit_write_avg_ns against the baseline prj.conf run.

# ── Inherit baseline config ────────────────────────────────────────────────
CONFIG_AKIRA_WASM_RUNTIME=y
CONFIG_AKIRA_AIINFER=y
CONFIG_AKIRA_TFLITE_MICRO=y
CONFIG_AKIRA_TFLITE_ESPNN=y
CONFIG_AKIRA_AIINFER_ARENA_KB=128
CONFIG_AKIRA_AIINFER_MAX_HANDLES=2
CONFIG_AKIRA_CAPABILITY_SYSTEM=y
CONFIG_AKIRA_SANDBOX=y
CONFIG_AKIRA_SANDBOX_EXEC_TIMEOUT_MS=30000
CONFIG_AKIRA_SANDBOX_RATE_LIMITING=n
CONFIG_AKIRA_SECURITY_AUDIT=y
CONFIG_AKIRA_AUDIT_LOG_SIZE=64
CONFIG_AKIRA_SANDBOX_MPU=n

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_AKIRA_LOG_LEVEL=3

CONFIG_BT=n
CONFIG_MP_MAX_NUM_CPUS=2
CONFIG_SCHED_CPU_MASK=y
CONFIG_AKIRA_WASM_START_TIMEOUT_MS=15000
CONFIG_AKIRA_WASM_STOP_TIMEOUT_MS=5000
CONFIG_MAX_CONTAINERS=2

CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_FILE_SYSTEM=y

CONFIG_AKIRA_PSRAM=y
CONFIG_ESP_SPIRAM=y
CONFIG_ESP_SPIRAM_SIZE=8388608
CONFIG_ESP_SPIRAM_HEAP_SIZE=4194304
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_SPIRAM_TYPE_ESPPSRAM64=y
CONFIG_SPIRAM_SPEED_80M=y
CONFIG_SPIRAM_RODATA=y
CONFIG_SPIRAM_FETCH_INSTRUCTIONS=y
CONFIG_ESP_SPIRAM_MEMTEST=n
CONFIG_MEMC=y

CONFIG_CPP=y
CONFIG_STD_CPP14=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_REQUIRES_FLOAT_PRINTF=y

# ── HMAC-specific ─────────────────────────────────────────────────────────
CONFIG_AKIRA_PLATFORM_AUDIT_HMAC=y
CONFIG_AKIRA_AUDIT_LOG_HMAC=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_SHA256=y
CONFIG_MBEDTLS_MD_C=y
