# cg_microbench — Capability Guard per-call overhead.
# Standalone: WAMR + the real src/runtime/security.c are added by CMakeLists;
# the AKIRA_* switches that security.c needs are passed as -D there, so this
# file only carries standard Zephyr config and builds for native_sim and ESP32-S3.

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=8192

# CCOUNT is read on the benchmark thread; pin it to a core.
CONFIG_MP_MAX_NUM_CPUS=2
CONFIG_SCHED_CPU_MASK=y

# WAMR's zephyr platform references fs types.
CONFIG_FILE_SYSTEM=y

CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_MAIN_STACK_SIZE=16384
