# AkiraOS Zephyr module manifest
#
# Makes AkiraOS usable as a Zephyr module from product firmware in its own
# repository. Usage in a downstream west.yml:
#
#   manifest:
#     projects:
#       - name: akira-os
#         url: https://github.com/ArturR0k3r/AkiraOS.git
#         revision: v1.6.x      # pin a release tag once one is cut
#         path: akira-os
#         import: true          # also brings in Zephyr, WAMR and TFLite Micro
#     self:
#       path: my-product
#
# In the product application:
#   - prj.conf:        CONFIG_AKIRA_OS=y   (every CONFIG_AKIRA_* option depends on it)
#   - CMakeLists.txt:  target_link_libraries(app PRIVATE akira_os)
#   - main():          return akira_start();   (standard AkiraOS boot sequence)
#
# The module also adds boards/ to the board search path and dts/ to the DTS
# bindings path. samples/out_of_tree_product/ is a complete example.
#
# Requires: Zephyr ≥ 4.0 (module.yml settings: board_root / dts_root added in 3.7)

name: akira-os

build:
  # zephyr/CMakeLists.txt builds the AkiraOS libraries when CONFIG_AKIRA_OS=y.
  cmake: zephyr
  # zephyr/Kconfig holds every AkiraOS option, gated by CONFIG_AKIRA_OS.
  kconfig: zephyr/Kconfig

  settings:
    # board_root: registers boards/ so Zephyr finds akiraconsole_prod,
    # akiraconsole, esp32s3_super_mini, and any custom boards in this tree.
    board_root: .

    # dts_root: registers dts/ so Zephyr finds AkiraOS DTS bindings
    # (akira,ili9341 akira,pwm-dial etc.) when building downstream projects.
    dts_root: .

    # module_ext_root: registers modules/modules.cmake, which provides Zephyr
    # glue for the wasm-micro-runtime west project.
    module_ext_root: .
