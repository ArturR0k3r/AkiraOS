# SPDX-License-Identifier: Apache-2.0
#
# Cut a release when a version tag (v*) is pushed. Builds prebuilt firmware for
# the launch boards, signs the MCUboot images with the product key from the
# MCUBOOT_KEY_PEM secret where the board supports it (unsigned otherwise — dev
# only), writes a per-board CycloneDX SBOM, and uploads everything to the
# GitHub release. Artifact names carry the board slug so matrix jobs do not
# overwrite each other on the release.
#
# Boards with `release: true` are built with the akira-release snippet (the
# SESIP evaluated configuration); the others are development images.
#
# Key handling: the signing key exists only inside the build steps (0600 file,
# removed on exit), no third-party code runs while it is on disk, and the job
# that holds it cannot write to the repository - publishing is a separate job.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    # The Zephyr CI image has no registered Zephyr SDK (ci.yml installs one
    # too): the "Zephyr SDK" step installs 0.17.4 with the board's toolchain.
    container: ghcr.io/zephyrproject-rtos/ci:v0.28.6@sha256:427a55fe95911ea97aa99fa0aedce95cb5550cbdd74f3525d23e35b2221f2335
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: akiraconsole/esp32s3/procpu
            slug: akiraconsole
            toolchain: xtensa-espressif_esp32s3_zephyr-elf
            blobs: true
            sign: true
            esp_chip: esp32s3          # build a merged full-flash image for the web flasher
            build_alias: akiraconsole
          - board: akiraconsole_prod/esp32s3/procpu
            slug: akiraconsole_prod
            toolchain: xtensa-espressif_esp32s3_zephyr-elf
            blobs: true
            sign: true
            release: true
            esp_chip: esp32s3
            build_alias: akiraconsole_prod
          - board: esp32s3_devkitm/esp32s3/procpu
            slug: esp32s3_devkitm
            toolchain: xtensa-espressif_esp32s3_zephyr-elf
            blobs: true
            sign: false
            esp_chip: esp32s3
            build_alias: esp32s3_devkitm_esp32s3_procpu
          - board: nrf54l15dk/nrf54l15/cpuapp
            slug: nrf54l15dk
            toolchain: arm-zephyr-eabi
            blobs: false
            sign: false
          - board: rpi_pico2/rp2350a/m33
            slug: rpi_pico2
            toolchain: arm-zephyr-eabi
            blobs: false
            sign: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: akira-os
          submodules: recursive
          persist-credentials: false

      # Pinned to the sha256.sum published with SDK 0.17.4; the toolchain is
      # fetched and checked here rather than by setup.sh.
      - name: Zephyr SDK
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        shell: bash
        run: |
          set -euo pipefail
          SDK_VER=0.17.4
          SDK=/opt/toolchains/zephyr-sdk-$SDK_VER
          URL=https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v$SDK_VER
          declare -A SUM=(
            [zephyr-sdk-${SDK_VER}_linux-x86_64_minimal.tar.xz]=a7258bf50c892c4669712b2aacdfcd5e303245bcf36cb458a296039a664594f5
            [toolchain_linux-x86_64_arm-zephyr-eabi.tar.xz]=1b61084fe12076a3639aa2d028b5258f41eb3d0f7d46a16264949e1d213f1915
            [toolchain_linux-x86_64_xtensa-espressif_esp32s3_zephyr-elf.tar.xz]=ed2c737bb12d6b68fc13590f9e3abae6c4bc0a7bdd4b06e6a024f56ab4acd231
          )
          fetch() {
            wget -q "$URL/$1" -O "/tmp/$1"
            echo "${SUM[$1]}  /tmp/$1" | sha256sum -c -
          }
          mkdir -p /opt/toolchains
          if [ ! -f "$SDK/sdk_version" ]; then
            fetch "zephyr-sdk-${SDK_VER}_linux-x86_64_minimal.tar.xz"
            tar xf "/tmp/zephyr-sdk-${SDK_VER}_linux-x86_64_minimal.tar.xz" -C /opt/toolchains
          fi
          if [ ! -d "$SDK/$TOOLCHAIN" ]; then
            fetch "toolchain_linux-x86_64_${TOOLCHAIN}.tar.xz"
            tar xf "/tmp/toolchain_linux-x86_64_${TOOLCHAIN}.tar.xz" -C "$SDK"
          fi
          rm -f /tmp/*.tar.xz
          (cd "$SDK" && ./setup.sh -c)
          echo "ZEPHYR_SDK_INSTALL_DIR=$SDK" >> "$GITHUB_ENV"
          echo "ZEPHYR_TOOLCHAIN_VARIANT=zephyr" >> "$GITHUB_ENV"

      - name: West workspace
        working-directory: akira-os
        run: |
          west init -l .
          west update
          west zephyr-export

      - name: Fetch ESP32 HAL blobs
        if: matrix.blobs
        working-directory: akira-os
        run: west blobs fetch hal_espressif

      - name: Build + sign + SBOM
        working-directory: akira-os
        env:
          BOARD: ${{ matrix.board }}
          SIGN: ${{ matrix.sign }}
          RELEASE: ${{ matrix.release }}
          MCUBOOT_KEY_PEM: ${{ secrets.MCUBOOT_KEY_PEM }}
        shell: bash
        run: |
          set -eu
          umask 077
          trap 'rm -f mcuboot-signing.pem' EXIT
          args=(-b "$BOARD" -s . -o dist)
          if [ "$SIGN" = "true" ]; then
            if [ -z "${MCUBOOT_KEY_PEM:-}" ]; then
              echo "::error::MCUBOOT_KEY_PEM is not set: refusing to publish an unsigned ${BOARD} image"
              exit 1
            fi
            printf '%s' "$MCUBOOT_KEY_PEM" > mcuboot-signing.pem
            args+=(-k mcuboot-signing.pem)
          fi
          if [ "$RELEASE" = "true" ]; then
            # Public reference image: its settings key is in the published
            # binary either way, so this only avoids sharing the repository's
            # default key. Products need a key provider (see SESIP doc).
            args+=(--release -D "CONFIG_AKIRA_SETTINGS_ENCRYPTION_KEY_HEX=\"$(openssl rand -hex 32)\"")
          fi
          west akira release "${args[@]}"

      - name: Rename artifacts with the board slug
        working-directory: akira-os
        env:
          SLUG: ${{ matrix.slug }}
          REF: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir -p out
          for f in dist/zephyr.signed.bin dist/zephyr.bin dist/zephyr.uf2 \
                   dist/zephyr.hex dist/zephyr.elf dist/sbom.cdx.json; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            case "$base" in
              zephyr.signed.bin) ext=".signed.bin" ;;
              sbom.cdx.json)     ext=".sbom.cdx.json" ;;
              *)                 ext=".${base#zephyr.}" ;;
            esac
            cp "$f" "out/akiraos-${REF}-${SLUG}${ext}"
          done
          ( cd out && sha256sum "akiraos-${REF}-${SLUG}"* > "SHA256SUMS-${SLUG}.txt" )
          ls -l out

      # Full-flash image (MCUboot @ 0x0 + app @ 0x20000) for the browser flasher at
      # docs.akiraos.dev/flash. Named without the tag so the page's
      # releases/latest/download/akiraos-<slug>-flash.bin link stays stable. Best effort:
      # a failure here must not block the rest of the release.
      - name: Build MCUboot + app for the merged image (ESP boards)
        id: merged_build
        if: matrix.esp_chip
        continue-on-error: true
        working-directory: akira-os
        env:
          MCUBOOT_KEY_PEM: ${{ secrets.MCUBOOT_KEY_PEM }}
          ALIAS: ${{ matrix.build_alias }}
          SIGN: ${{ matrix.sign }}
          RELEASE: ${{ matrix.release }}
        run: |
          set -eu
          umask 077
          trap 'rm -f mcuboot-signing.pem' EXIT
          KEY=""
          if [ "$SIGN" = "true" ]; then
            printf '%s' "$MCUBOOT_KEY_PEM" > mcuboot-signing.pem
            KEY="-k mcuboot-signing.pem"
          fi
          REL=""
          if [ "$RELEASE" = "true" ]; then
            REL="--release"
            # See the note on the settings key in the build step above.
            AKIRA_SETTINGS_KEY_HEX="$(openssl rand -hex 32)"
            export AKIRA_SETTINGS_KEY_HEX
          fi
          # Build MCUboot + app with the board's real snippets/overlays/offsets.
          ./build.sh -b "$ALIAS" -bl y $KEY $REL

      # esptool comes from PyPI: installed only after the key is gone, in a step
      # that gets no secrets.
      - name: Merged flash image (ESP boards)
        if: matrix.esp_chip && steps.merged_build.outcome == 'success'
        continue-on-error: true
        working-directory: akira-os
        env:
          CHIP: ${{ matrix.esp_chip }}
          SLUG: ${{ matrix.slug }}
        run: |
          set -eu
          [ ! -e mcuboot-signing.pem ]
          pip install --quiet "esptool==4.8.1"
          boot=$(find .. -path '*build-mcuboot*/zephyr/zephyr.bin' | head -1)
          app=$(find .. -path '*/zephyr/zephyr.signed.bin' -not -path '*mcuboot*' | head -1)
          [ -n "$app" ] || app=$(find .. -path '*/zephyr/zephyr.bin' -not -path '*mcuboot*' -not -path '*/dist/*' | head -1)
          echo "MCUboot: $boot"; echo "App: $app"
          [ -n "$boot" ] && [ -n "$app" ]
          esptool --chip "$CHIP" merge_bin -o "out/akiraos-${SLUG}-flash.bin" \
            0x0 "$boot" 0x20000 "$app"
          ( cd out && sha256sum "akiraos-${SLUG}-flash.bin" >> "SHA256SUMS-${SLUG}.txt" )
          ls -l out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firmware-${{ matrix.slug }}
          path: akira-os/out/*
          if-no-files-found: error

  # Only this job can write to the repository, and it never sees a key.
  publish:
    needs: firmware
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: firmware-*
          path: out
          merge-multiple: true

      # Never publish (or overwrite) a release without firmware in it.
      - name: Require artifacts
        shell: bash
        run: |
          shopt -s nullglob
          files=(out/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No board produced firmware: not publishing a release"
            exit 1
          fi
          ls -l out

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: out/*
