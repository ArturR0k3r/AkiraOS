# AkiraOS Documentation - GitHub Pages Configuration

# Theme
remote_theme: just-the-docs/just-the-docs@v0.7.0

# Color scheme (dark theme)
color_scheme: dark

# Enable mermaid
mermaid:
  version: "10.6.1"

# Site settings
title: AkiraOS
description: High-Performance WebAssembly OS for Embedded Systems
baseurl: ""
url: "https://docs.akiraos.dev"

# Logo and branding
logo: "/AKIRAOS-LOGO-removebg-preview.png"
favicon_ico: "/AKIRAOS-LOGO-removebg-preview.png"

# Social media preview
image: /AKIRAOS-LOGO.png
author: AkiraOS Team

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Plugins
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-titles-from-headings
  - jekyll-seo-tag

# Relative links
relative_links:
  enabled: true
  collections: false

# Optional front matter
optional_front_matter:
  remove_originals: false

# Titles from headings
titles_from_headings:
  enabled: true
  strip_title: true
  collections: false

# Exclude from build
# The GitHub Pages source is this `docs/` folder, so only paths that actually
# exist inside docs/ are meaningful here.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/

# Include
include:
  - _*.yml
  - .htaccess

# Just the Docs Configuration
aux_links:
  "AkiraOS on GitHub":
    - "//github.com/ArturR0k3r/AkiraOS"

# Navigation
nav_enabled: true
search_enabled: true

# Footer content
footer_content: "Copyright &copy; 2026 PenEngineering S.R.L and the AkiraOS Contributors. Licensed under the Apache License 2.0."

# Enable search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Defaults
#
# Only `layout` is defaulted here. Parent/nav_order are declared explicitly in each
# page's own front matter.
#
# Injecting `parent:` via a path scope (as this file used to do) also hits that
# directory's own index.md — which declares `has_children: true` — making every
# section index its own child and corrupting the nav tree. Per-page front matter
# avoids that and also covers ai/, compliance/, connectivity/, hub/, reference/
# and release/, which had no scope at all.
defaults:
  - scope:
      path: ""
    values:
      layout: default

# GitHub metadata
repository: ArturR0k3r/AkiraOS
github_username: ArturR0k3r