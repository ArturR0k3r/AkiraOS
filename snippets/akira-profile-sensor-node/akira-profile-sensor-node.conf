# SPDX-License-Identifier: Apache-2.0
#
# akira-profile-sensor-node: a headless sensor product — akira-profile-minimal
# plus the sensor, ADC and watchdog WASM APIs. No networking or display. The
# sensor and ADC *hardware* come from the board conf (akira-board).

CONFIG_AKIRA_WASM_RUNTIME=y
CONFIG_AKIRA_WASM_API=y
CONFIG_AKIRA_RUNTIME_CUSTOM=y
CONFIG_WAMR_AOT_SUPPORT=n
CONFIG_AKIRA_WASM_LIFECYCLE=y
CONFIG_AKIRA_WASM_IPC=y
CONFIG_AKIRA_WASM_SETTINGS=y
CONFIG_AKIRA_APP_MANAGER=y
CONFIG_AKIRA_APP_SIGNING=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_STREAM_FLASH=y
CONFIG_NVS=y
CONFIG_AKIRA_SETTINGS=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_BASE64=y
CONFIG_POSIX_API=y
CONFIG_REBOOT=y
CONFIG_LOG=y
CONFIG_SHELL=y
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_KERNEL_MEM_POOL=y

# sensor-node AkiraOS services (sensor/ADC hardware from the board conf)
CONFIG_AKIRA_WASM_ADC=y
CONFIG_AKIRA_WASM_WDT=y
CONFIG_AKIRA_WDT=y

# Networked services default to y in Kconfig; a non-connected product turns them
# off so it does not pull the IP stack (use akira-profile-connected for those).
CONFIG_AKIRA_HTTP_SERVER=n
CONFIG_AKIRA_OTA=n
CONFIG_AKIRA_CLOUD_CLIENT=n
CONFIG_AKIRA_MDNS=n
