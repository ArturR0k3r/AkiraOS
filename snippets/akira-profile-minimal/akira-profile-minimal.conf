#
# akira-profile-minimal: the smallest AkiraOS product — run signed WASM apps
# with a filesystem and settings, over the shell. No networking, OTA or radios.
# Layer board hardware from the akira-board snippet; add services with another
# profile or your own conf listed after this one.

# WASM runtime + native API
CONFIG_AKIRA_WASM_RUNTIME=y
CONFIG_AKIRA_WASM_API=y
CONFIG_AKIRA_RUNTIME_CUSTOM=y
CONFIG_WAMR_AOT_SUPPORT=n
CONFIG_AKIRA_WASM_LIFECYCLE=y
CONFIG_AKIRA_WASM_IPC=y
CONFIG_AKIRA_WASM_SETTINGS=y

# App manager + signing
CONFIG_AKIRA_APP_MANAGER=y
CONFIG_AKIRA_APP_SIGNING=y

# Persistent storage
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_STREAM_FLASH=y
CONFIG_NVS=y
CONFIG_AKIRA_SETTINGS=y

# Crypto for app signature verification
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_BASE64=y

# Kernel services AkiraOS relies on
CONFIG_POSIX_API=y
CONFIG_REBOOT=y
CONFIG_LOG=y
CONFIG_SHELL=y
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_KERNEL_MEM_POOL=y
