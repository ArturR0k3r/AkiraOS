# SPDX-License-Identifier: Apache-2.0
#
# akira-profile-connected: a networked AkiraOS product — everything in
# akira-profile-minimal plus the IP stack, HTTP app upload, mDNS discovery and
# OTA over MCUboot. WiFi hardware (WIFI_ESP32, offload) stays in the board conf.
# Apply as: AKIRA_SNIPPETS="akira-profile-connected;akira-board".

# --- minimal core (repeated so this profile stands alone) ---
CONFIG_AKIRA_WASM_RUNTIME=y
CONFIG_AKIRA_WASM_API=y
CONFIG_AKIRA_RUNTIME_CUSTOM=y
CONFIG_WAMR_AOT_SUPPORT=n
CONFIG_AKIRA_WASM_LIFECYCLE=y
CONFIG_AKIRA_WASM_IPC=y
CONFIG_AKIRA_WASM_SETTINGS=y
CONFIG_AKIRA_APP_MANAGER=y
CONFIG_AKIRA_APP_SIGNING=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_STREAM_FLASH=y
CONFIG_NVS=y
CONFIG_AKIRA_SETTINGS=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_BASE64=y
CONFIG_POSIX_API=y
CONFIG_REBOOT=y
CONFIG_LOG=y
CONFIG_SHELL=y
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_KERNEL_MEM_POOL=y

# --- networking ---
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
CONFIG_DNS_RESOLVER=y
CONFIG_MDNS_RESOLVER=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_MBEDTLS_SHA1=y

# --- services over the network ---
CONFIG_AKIRA_HTTP_SERVER=y
CONFIG_AKIRA_WIFI_MANAGER=y
CONFIG_AKIRA_OTA=y
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_IMG_MANAGER=y
CONFIG_IMG_ENABLE_IMAGE_CHECK=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
