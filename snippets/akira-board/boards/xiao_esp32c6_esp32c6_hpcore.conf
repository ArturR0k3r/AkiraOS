# BOARD_ZEPHYR: xiao_esp32c6/esp32c6/hpcore
# BOARD_CHIP: esp32c6
# BOARD_DESC: Seeed XIAO ESP32-C6 (RISC-V HP Core, 4MB Flash)
# XIAO ESP32-C6: RISC-V @ 160MHz, 512KB SRAM, 4MB Flash
# Console: USB serial (usb_serial, no physical UART adapter needed)
# Radios: WiFi 6, BLE 5.3, IEEE 802.15.4

###############################################################################
# Memory
###############################################################################
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_WAMR_HEAP_SIZE=131072

###############################################################################
# Thread Local Storage — MANDATORY for WAMR on RISC-V
###############################################################################

###############################################################################
# Console — XIAO uses the built-in ESP32-C6 USB-Serial/JTAG peripheral
# (CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG=y, enabled automatically via DTS).
# Do NOT enable CONFIG_USB_DEVICE_STACK here — it conflicts with the native
# USB-JTAG hardware peripheral and prevents boot.
###############################################################################

###############################################################################
# WiFi 6
###############################################################################

###############################################################################
# BLE 5.3
###############################################################################

###############################################################################
# IEEE 802.15.4 — Thread radio
###############################################################################

###############################################################################
# Peripherals
###############################################################################
CONFIG_SPI=y
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_ADC=y
CONFIG_PWM=y

###############################################################################
# Flash and Storage — 4MB flash, no MCUboot (test build)
###############################################################################
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_STREAM_FLASH=y
# MCUboot disabled — 4MB is tight; re-enable for production
# HTTP server + OTA require MCUboot; disable both for this test build

###############################################################################
# LittleFS
###############################################################################

###############################################################################
# Network buffers
###############################################################################

###############################################################################
# WAMR — AOT disabled on RISC-V
###############################################################################

###############################################################################
# App Manager
###############################################################################
CONFIG_MAX_CONTAINERS=3

###############################################################################
# Matter/Thread co-processor IPC — enabled for testing
# UART1 TX=GPIO4 (D2), RX=GPIO5 (D3) on XIAO header
# Connect to co-processor (e.g. ESP32-H2) or leave disconnected to test
# graceful init failure path ("matter coproc not responding").
###############################################################################
# Device-as-endpoint (accessory) direction: matter_endpoint_add / report_attr /
# cmd_poll natives + the "matter pair" / "matter status" / "matter inject"
# shell commands. Lets AkiraOS be adopted as a Matter accessory.
# No real esp-matter co-processor firmware exists yet, so run the in-firmware
# MOCK co-processor: the accessory path (matter_demo app, `matter pair`) works
# end-to-end on this board with nothing wired to UART1. TEST/BRING-UP ONLY —
# remove once a real co-processor is connected.

