# on current Zephyr (the old CONFIG_ETH_STM32_HAL_MII symbol was removed); the
# upstream nucleo_h743zi board already sets RMII for its LAN8742A.

###############################################################################
# WiFi — not available on bare Nucleo (no radio)
###############################################################################

###############################################################################
# Bluetooth — not available on bare Nucleo
###############################################################################

###############################################################################
# GPIO and peripherals
###############################################################################
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_ADC=y
CONFIG_PWM=y

###############################################################################
# SD card via SPI/SDMMC on Nucleo
###############################################################################
CONFIG_DISK_ACCESS=y

