# BOARD_ZEPHYR: esp32s3_super_mini/esp32s3/procpu
# BOARD_CHIP: esp32s3
# BOARD_DESC: ESP32-S3 Super Mini (FH4R2: 4MB Flash, 2MB Quad PSRAM)
# BOARD_ALIAS: esp32s3_super_mini

# =============================================================================
# ESP32-S3 Super Mini Board Configuration for AkiraOS
# ESP32-S3FH4R2: 4MB Flash, 2MB Quad PSRAM
# =============================================================================


###############################################################################
# PSRAM (External SPIRAM) Configuration - 2MB Quad PSRAM (ESP32-S3FH4R2)
# The FH4R2 package has 2MB of in-package Quad-SPI PSRAM. Enabling it moves
# large AKIRA_BULK_BSS buffers (buf_pool, IPC topics, signing state, BLE/net
# buffers) and the WAMR allocator into external RAM, freeing internal DRAM so
# WiFi + BT + WASM fit. Without this the .dram0.bss segment overflows.
###############################################################################
CONFIG_ESP_SPIRAM=y
CONFIG_ESP_SPIRAM_SIZE=2097152
CONFIG_ESP_SPIRAM_HEAP_SIZE=1048576
CONFIG_SPIRAM_MODE_QUAD=y
CONFIG_SPIRAM_TYPE_ESPPSRAM16=y
# 40MHz is the robust speed for in-package Quad PSRAM. 80MHz is marginal and
# was causing intermittent/failed boots (device appears dead, no serial output
# — PSRAM init runs in the bootloader before Zephyr prints). Bump to 80M only
# if verified stable.
CONFIG_SPIRAM_SPEED_40M=y
CONFIG_AKIRA_PSRAM=y

# MEMC driver — REQUIRED for the PSRAM/AKIRA_PSRAM helper APIs
CONFIG_MEMC=y

# Keep read-only data in flash/internal (only move .bss to PSRAM)
CONFIG_SPIRAM_RODATA=y
# PSRAM validated stable at 40MHz Quad; memtest disabled for faster boot.
# Re-enable if PSRAM behaviour becomes suspect.
CONFIG_ESP_SPIRAM_MEMTEST=n

###############################################################################
# Memory Configuration (4MB Flash, 2MB PSRAM)
# BT controller needs ~50KB at init from INTERNAL DRAM (the BT/WiFi controllers
# cannot DMA from PSRAM). The ESP_BT/ESP_WIFI HEAP_MEM_POOL_ADD_SIZE options
# add ~66KB on top of this base, so 64KB base leaves ~132KB total heap while
# freeing internal DRAM. (Matches the devkitm PSRAM config.)
###############################################################################
CONFIG_MAX_CONTAINERS=2
# Trimmed from 85536 to make room for the MQTT client (see the Home Assistant
# section below). Still above the ~80KB BT-controller floor.
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_MAIN_STACK_SIZE=4096
# BLE app install (bt_app_transfer.c) runs the install chain on the system
# workqueue, which it documents as needing ~4KB. 2KB overflows during a WASM
# install (validate + SHA-256 + LittleFS write) → sysworkq stack overflow.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=16384
CONFIG_SHELL_STACK_SIZE=8192

###############################################################################
# Bluetooth
# ── disable all: CONFIG_BT=n
###############################################################################

# --- BT debug for connection diagnostics ---

CONFIG_LOG_MODE_IMMEDIATE=y
###############################################################################
# WiFi — enabled; large buffers offloaded to PSRAM (see PSRAM section above)
###############################################################################

###############################################################################
# HID
# ── disable BT HID:  CONFIG_AKIRA_BT_HID=n
# ── disable all HID: CONFIG_AKIRA_HID=n
###############################################################################

###############################################################################
# AkiraOS Bluetooth Features
###############################################################################

###############################################################################
# PWM — LEDC on GPIO4/5/6 for the WASM RGB controller app (pwm_set from WASM).
# Requires the ledc0 node in the board overlay.
###############################################################################
CONFIG_PWM=y
# BLE peripheral API for WASM apps (rgb_controller stands up its own GATT
# service). Registers the ble_* import functions.

###############################################################################
# Display — disabled on ESP32-S3 Super Mini (no display hardware)
###############################################################################
CONFIG_DISPLAY=n
CONFIG_MIPI_DBI=n
CONFIG_MIPI_DBI_SPI=n
CONFIG_AKIRA_FONTS_IN_PSRAM=n
CONFIG_AKIRA_FRAMEBUFFER_IN_PSRAM=n

###############################################################################
# MQTT — disabled. ha_rgb is now controlled from the AkiraHub dashboard
# (app_cmd_bridge over IPC), not Home Assistant/MQTT.
###############################################################################

###############################################################################
# Settings — raised to fit the combined "ssid\tpsk" WiFi credentials value
###############################################################################

###############################################################################
# Networking — provisioning-AP support (CONFIG_MDNS_RESOLVER already set in
# prj.conf; not repeated here)
###############################################################################

# DHCPv4 server (provisioning SoftAP) + a second IPv4 address slot for the
# AP+STA dual-iface setup below.

# AP+STA coexistence — required for the ESP32 driver's AP-role net_if
# (WIFI_TYPE_SAP) and its dedicated AP RX path. Without this, AP-mode IP
# traffic (e.g. DHCP DISCOVER from a provisioning client) runs through the
# untested single-iface fallback and never reaches the IP stack.
# (cascades: ESP32_WIFI_AP_STA_MODE=y, WIFI_NM_MAX_MANAGED_INTERFACES=2)

# Zephyr's net/config auto-init races the ESP32 driver's own connect-driven
# DHCP start (esp_wifi_handle_sta_connect_event -> net_dhcpv4_start()) —
# disable it so only the explicit wifi_manager-driven flow runs.

# Default is 6 — static contexts[] array (net_context.c) shared by every
# 5-tuple: DHCP server, HTTP listen :80, HTTP listen :8080 (dev upload),
# DNS resolver, hub_registration's outbound connect all hold a slot
# simultaneously, leaving none for an incoming provisioning client — SYNs
# get RST'd with "net_context_get(): -2 / Cannot allocate a new TCP connection".
# Default is 1 — DHCPv4 server (net_socket_service) already holds the sole
# slot, so http_server_start()'s own eventfd() fails with ENOMEM.
# accept_new_client failed with ENFILE (-23): auto-computed fd count leaves
# no headroom for an actual incoming HTTP client on top of our listeners
# (mDNS x2, DHCP :67/:68, HTTP :80/:8080, shell, console).
# Enable SO_RCVTIMEO / SO_SNDTIMEO so recv/send on accepted sockets can
# time out instead of blocking forever when the peer stalls.
# TCP windows: larger values improve HTTP throughput
# Bumped for the styled provisioning page (~1.9KB, was ~85 bytes) — at the old
# 128B/buf size a single 1460B TCP segment needed ~12 of the 20-buffer pool,
# so it exhausted under retransmit + concurrent DNS/DHCP/ARP traffic:
# "net_pkt: Data buffer (1500) allocation failed" / TCP window_full forever.

# Default is 3 — provisioning's HTTP_SERVICE_DEFINE requests concurrent=4
# (was 1, which serialized clients and caused ~10s stalls in the captive
# portal flow). BUILD_ASSERT requires this >= that concurrent value.
