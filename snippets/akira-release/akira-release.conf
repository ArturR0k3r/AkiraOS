#
# akira-release: the security configuration a shipped AkiraOS product runs, and
# the evaluated configuration of the SESIP Security Target
# (docs/compliance/sesip-evaluated-configuration.md). Apply it after the board and
# profile snippets so it wins:
#   ./build.sh -b <board> -bl y -k keys/mcuboot-signing.pem --release   (adds it)
#   west build -b <board> AkiraOS -S akira-release
# Firmware signing and the MCUboot settings come from the product key
# (build.sh -k, or west akira sign); see docs/development/signing-and-release.md.

# Fail configuration on any remaining development-only setting
# (cmake/akira_release_checks.cmake). Also defaults on: hardened unattested
# apps, full WAMR validation, no `debug memdump`, OTA downgrade refusal.
CONFIG_AKIRA_RELEASE_BUILD=y

# No plain-HTTP management endpoints (firmware and app upload, app control).
CONFIG_AKIRA_HTTP_SERVER=n

# No shell on the network.
CONFIG_SHELL_BACKEND_TELNET=n

# Unsigned apps are never loaded as if they were signed.
CONFIG_AKIRA_ALLOW_UNSIGNED_APPS=n
