#
# akira-profile-console: AkiraOS service selection for a hand-held console
# (screen, buttons, BT, USB-HID). The display controller, input GPIOs, BT and
# USB *hardware* come from the board conf (akira-board); this profile turns on
# the AkiraOS services that use them. Pair with akira-profile-connected for WiFi.

CONFIG_AKIRA_WASM_RUNTIME=y
CONFIG_AKIRA_WASM_API=y
CONFIG_AKIRA_APP_MANAGER=y
CONFIG_AKIRA_APP_SIGNING=y
CONFIG_AKIRA_WASM_LIFECYCLE=y
CONFIG_AKIRA_WASM_IPC=y
CONFIG_AKIRA_WASM_SETTINGS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_AKIRA_SETTINGS=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_BASE64=y
CONFIG_POSIX_API=y
CONFIG_REBOOT=y
CONFIG_LOG=y
CONFIG_SHELL=y
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_KERNEL_MEM_POOL=y

# console-facing AkiraOS services (hardware enabled by the board conf)
CONFIG_AKIRA_OS_SHELL=y
CONFIG_AKIRA_APP_SOURCE_SD=y
CONFIG_AKIRA_WASM_BLE=y
CONFIG_AKIRA_WASM_HID=y

# Networked services default to y in Kconfig; a non-connected product turns them
# off so it does not pull the IP stack (use akira-profile-connected for those).
CONFIG_AKIRA_HTTP_SERVER=n
CONFIG_AKIRA_OTA=n
CONFIG_AKIRA_CLOUD_CLIENT=n
CONFIG_AKIRA_MDNS=n
