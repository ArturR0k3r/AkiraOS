#
# MCUboot upgrade mode for the build.sh (non-sysbuild) bootloader build.
#
# MCUboot's Espressif SoC defaults (bootloader/mcuboot/boot/zephyr/socs/esp32*.conf)
# pick CONFIG_BOOT_UPGRADE_ONLY, which overwrites slot0 with the new image and
# destroys the previous firmware, so a bad OTA image can never be reverted.
# The application side already builds for swap-using-move
# (CONFIG_MCUBOOT_BOOTLOADER_MODE_SWAP_USING_MOVE is Zephyr's ESP32 default), so
# build the bootloader to match: the new image boots as a trial, and MCUboot
# swaps the previous firmware back if the trial image is not confirmed before
# the next reset (see include/akira_boot_guard.h).
CONFIG_BOOT_SWAP_USING_MOVE=y
