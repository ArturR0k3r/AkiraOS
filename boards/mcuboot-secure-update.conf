#
# MCUboot secure-update profile for the build.sh (non-sysbuild) bootloader
# build, applied when a product signing key is given (./build.sh -k <key.pem>).
# build.sh also sets CONFIG_BOOT_SIGNATURE_TYPE_* and CONFIG_BOOT_SIGNATURE_KEY_FILE
# from that key, overriding MCUboot's Espressif default of BOOT_SIGNATURE_TYPE_NONE.
#
# Refuse an update whose image version (stamped from AkiraOS/VERSION by imgtool)
# is lower than the running image's. Applies to test and permanent upgrades
# only, so a trial image that fails still reverts (see include/akira_boot_guard.h).
CONFIG_MCUBOOT_DOWNGRADE_PREVENTION=y
# Verify the primary image's signature on every boot, not only after a swap.
CONFIG_BOOT_VALIDATE_SLOT0=y
