# BOARD_ZEPHYR: akiraconsole_prod/esp32s3/procpu
# BOARD_CHIP:  esp32s3
# BOARD_DESC:  AkiraConsole Production (ESP32-S3-WROOM-1-N16R8)
# BOARD_ALIAS: akiraconsole_prod

###############################################################################
# PSRAM — ESP32-S3-WROOM-1-N16R8: 16 MB Flash, 8 MB OPI PSRAM
###############################################################################
CONFIG_ESP_SPIRAM=y
CONFIG_ESP_SPIRAM_SIZE=8388608
CONFIG_ESP_SPIRAM_HEAP_SIZE=4194304
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_AKIRA_PSRAM=y
CONFIG_SPIRAM_TYPE_ESPPSRAM64=y
# SPIRAM_SPEED_80M requires ESPTOOLPY_FLASHFREQ_80M; flash runs at 40 MHz → defaults to 40 MHz
CONFIG_MEMC=y
CONFIG_SPIRAM_RODATA=y
CONFIG_SPIRAM_FETCH_INSTRUCTIONS=y
CONFIG_ESP_SPIRAM_MEMTEST=n
# WASM stacks in SRAM — avoids SPI0/PSRAM conflict on flash reads
# Reduced from 16384 to 8192 to fit OS shell + RF drivers in DRAM (saves 16 KB across 2 containers)
CONFIG_AKIRA_WASM_APP_STACK_SIZE=8192
CONFIG_WAMR_AOT_SUPPORT=y


###############################################################################
# Memory
# CONFIG_HEAP_MEM_POOL_SIZE=-1 -> Dynamic/Automatic (All remaining RAM).
# Internal SRAM heap reduced to fit display + TCA6408 in dram0.bss.
# Large allocations use the 4 MB PSRAM heap (ESP_SPIRAM_HEAP_SIZE).
# Stack sizes tuned to free ~10 KB DRAM for USB HID subsystem (~8.7 KB).
###############################################################################
# The ESP32-S3 BT controller and its PHY RF-calibration buffers are allocated
# from THIS heap at bt_enable(), out of internal DRAM only — PSRAM cannot back
# it. History: 55 KB panicked in phy_init ("failed to allocate RF calibration
# data"); 58 KB was sufficient with WiFi OFF. 73 KB (74752) was the floor with
# BT+WiFi running together (coexistence layer + a second PHY calibration).
#
# The value below isn't the real floor by itself: Zephyr's build sums every
# subsystem's CONFIG_HEAP_MEM_POOL_ADD_SIZE_* requirement (ESP_BT=25600,
# ESP_WIFI=19456, plus ~1088 for POSIX/DNS/socketpair) and uses whichever is
# larger, that sum or this value (kernel/CMakeLists.txt). 46144 is set here
# to match that sum exactly, so the heap doesn't silently grow past what's
# written here — going lower has no effect, going higher just wastes DRAM.
# MAIN_STACK_SIZE is hardware-measured with `kernel thread stacks`: 2092 B
# peak during boot init, 2624 B peak after a full session (apps, HTTP, SD,
# RF). 4096 keeps ~1.4 KB of headroom over the worst reading.
CONFIG_HEAP_MEM_POOL_SIZE=46144
CONFIG_MAIN_STACK_SIZE=4096
# Reclaimed for the BT controller's internal-DRAM heap after CONFIG_BT=y.
# Shell only runs short commands (se050/kernel/wifi_status); OTA/app-install
# run in the HTTP thread, not here. Both are hardware-measured with
# `kernel thread stacks` over a full session: sysworkq peaked at 1240 B,
# shell_uart at 1556 B. 3072 leaves each roughly double its worst reading.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072
CONFIG_SHELL_STACK_SIZE=3072
CONFIG_SHARED_MULTI_HEAP=y

# Dev builds: allow locally-packed .akpkg without a signing key.
CONFIG_AKIRA_ALLOW_UNSIGNED_APPS=y


###############################################################################
# Flash — 16 MB DIO 40 MHz
###############################################################################
CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
CONFIG_ESPTOOLPY_FLASHMODE_DIO=y
CONFIG_ESPTOOLPY_FLASHFREQ_40M=y


###############################################################################
# SMP — dual-core (core0 + core1), no thread pinning (all threads float,
# scheduler balances both cores). SOC_ENABLE_APPCPU auto-selects on
# (IPM || MBOX); CONFIG_IPM=y alone just satisfies that gate — no IPM
# driver/ISR is actually wired (would need CONFIG_ESP32_SOFT_IPM + a DT
# node), cross-core signaling is Zephyr's own SMP IPI.
# APPCPU_AUTOLOAD_IMAGE=n: core1 runs the same Zephyr image as core0, not
# a separate esp_appcpu_image_load blob, so the IRAM/DRAM carve-out below
# only needs to be non-zero (some configs choke on a literal 0), not sized
# for a real image.
CONFIG_IPM=y
CONFIG_ESP_APPCPU_AUTOLOAD_IMAGE=n
CONFIG_ESP_APPCPU_IRAM_SIZE=0x1000
CONFIG_ESP_APPCPU_DRAM_SIZE=0x1000
CONFIG_SMP=y
CONFIG_MP_MAX_NUM_CPUS=2
# Required even with no manual pinning: the SMP net_tc.c patch pins RX/TX
# net threads to core0 unconditionally (WiFi blob isn't SMP-safe), and
# k_thread_cpu_pin() only links in when this is set.
CONFIG_SCHED_CPU_MASK=y
# Default 2048 is one ISR stack shared by both cores under SMP (cross-core
# IPI + any ISR-context callback) — undersized here overflows into a
# Xtensa register-window-underflow fault (EXCCAUSE=28, faulting address
# 0xfffffff4) under interrupt load, not a stack any per-thread margin
# fixes.
#
# Back to 8192 while MP_MAX_NUM_CPUS=1 above: one core means one of these, so
# the documented-safe size costs what the halved pair used to. Measured usage
# on core 0 was only 396 B, but 4096 was never verified under interrupt load,
# and this removes that unknown from the hang investigation. If the CPU count
# goes back to 2, this has to drop to 4096 again or the budget will not close.
CONFIG_ISR_STACK_SIZE=8192


###############################################################################
# Bluetooth — ON, coexisting with WiFi (see HEAP_MEM_POOL_SIZE above)
# ── disable all: CONFIG_BT=n
###############################################################################
CONFIG_BT=y
CONFIG_MBEDTLS_PSA_P256M_DRIVER_ENABLED=y
# P256M off (see check_config.h partial-ECC-accel guard) means BT_ECC's LESC
# ECDH runs through builtin MBEDTLS_ECP_C bignum math on the long workqueue —
# stack-hungrier than the P256M driver. Default 1400 (Kconfig BT_ECC default)
# overflowed BT LW WQ.
CONFIG_BT_LONG_WQ_STACK_SIZE=2048
CONFIG_BT_PERIPHERAL=y
# Observer role: required for BLE scan (bt_le_scan_start/stop/cb_register) —
# used by the ble_scan_* WASM API (src/connectivity/bluetooth/bt_manager.c).
CONFIG_BT_OBSERVER=y
# Without this, Zephyr's host generates a fresh NRPA (random) address for
# scan whenever nothing is advertising (id.c: bt_id_set_scan_own_addr) — an
# address-type path this ESP32-S3 BT controller rejects (LE Set Scan
# Parameters -> HCI status 0x12 Invalid Parameters, bt_le_scan_start -EINVAL).
# Forces scan to reuse the public identity address instead, same as advertising.
CONFIG_BT_SCAN_WITH_IDENTITY=y
CONFIG_BT_DEVICE_NAME="AkiraConsole"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=32
CONFIG_BT_MAX_CONN=1
# Deep sleep HAL (rtc_sleep.c) adds ~4 KB IRAM → DRAM dummy grows 4320 B.
# Recover with targeted buffer trims totalling ~3.8 KB (>3440 B overflow):
#  • Timer task stack: 4096→2048 B (saves 2048 B noinit; callbacks are brief)
#  • Sockets service stack: 2048→1024 B (saves 1024 B noinit)
#
# ATT MTU must fit the companion service's 244-byte characteristic value
# (CHAR_BUF_SIZE in companion_service.c). 247 = 244 + 3 (ATT write header);
# the ACL buffers add the 4-byte L2CAP header on top.
#
# These were 200 B, chosen when BT HID was the only BLE mode — enough for HID
# reports and service discovery. That silently breaks companion bulk transfer:
# an ATT MTU of 200 caps a write at 197 B, so the phone's 244-byte DATA_UP
# frames are rejected by its own stack and never reach the device (symptom:
# "BLE install begin" logged, then a client-side "GATT operation failed" with
# nothing further on the device).
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_ATT_PREPARE_COUNT=1
CONFIG_BT_GATT_DYNAMIC_DB=y
# 1024 overflowed the BT RX work-queue on the first GATT/SMP connection (stack
# overflow panic). Restored to safe sizes — GATT discovery + just-works pairing
# run in BT RX WQ. DRAM reclaimed from the net buffer pools below.
CONFIG_BT_RX_STACK_SIZE=2304
CONFIG_BT_HCI_TX_STACK_SIZE=1536
CONFIG_BT_SMP=y
CONFIG_BT_SIGNING=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
CONFIG_BT_SMP_SC_PAIR_ONLY=n
CONFIG_BT_GATT_SERVICE_CHANGED=y
CONFIG_BT_GATT_CACHING=y
CONFIG_BT_EXT_ADV=y
# 255 is the HCI event length field's hard ceiling for a single LE Extended
# Advertising Report event, regardless of ext-adv's larger on-air PDU size.
CONFIG_BT_BUF_EVT_DISCARDABLE_SIZE=255
# Host-side reassembly buffer (subsys/bluetooth/host/scan.c ext_scan_buf),
# separate from the per-event ceiling above.
CONFIG_BT_EXT_SCAN_BUF_SIZE=264
CONFIG_BT_BUF_ACL_TX_COUNT=12
CONFIG_BT_BUF_EVT_RX_COUNT=13
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_BAS=y
# Right-size the ESP32-S3 BT controller to what we actually use (1 peripheral
# connection). Defaults (LE_MAX_CONN=3, LE_MAX_ACT=6) over-allocate controller
# RAM and contributed to bt_enable() -ENOMEM. 1 conn + advertising needs ACT=2;
# keep 3 for headroom.
CONFIG_ESP32_BT_CTLR_LE_MAX_CONN=1
CONFIG_ESP32_BT_CTLR_LE_MAX_ACT=3
CONFIG_BT_EXT_ADV_MAX_ADV_SET=2

###############################################################################
# WiFi
# Required by AkiraMesh's WiFi transport (radio_wifi.c).
###############################################################################
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_ESP_WIFI_HEAP_SPIRAM=y
CONFIG_ESP32_WIFI_STA_AUTO_DHCPV4=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_SHELL_BACKEND_TELNET=n
# NET_SOCKETS_OFFLOAD OFF: matches esp32s3_super_mini's proven native-mode
# tuning (AkiraPlatform's hub TLS verified there).
# CONFIG_NET_LOG=y: sockets_tls.c's NET_ERR (the line that prints the actual
# mbedTLS handshake failure code) is compiled out without CONFIG_NET_LOG —
# needed to see *why* a handshake fails instead of a bare ECONNABORTED errno.
CONFIG_AKIRA_WASM_NET_TLS=n
CONFIG_NET_LOG=y
CONFIG_MBEDTLS_HEAP_SIZE=49152
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=4096
CONFIG_ESP32_BT_CONTROLLER_STACK_SIZE=4096
CONFIG_ESP32_BT_CONTROLLER_TASK_PRIO=2
CONFIG_ESP32_WIFI_AMPDU_TX_ENABLED=n
CONFIG_ESP32_WIFI_AMPDU_RX_ENABLED=n
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=4096
CONFIG_ESP32_TIMER_TASK_STACK_SIZE=2048
# esp32s3_super_mini's native-mode tuning, same underlying driver constraint:
# default NET_MAX_CONTEXTS=6 starves fast (HTTP :80/:8080, DNS, shell, DHCP
# already hold slots); NET_CONFIG_AUTO_INIT races the driver's own
# connect-triggered DHCP start.
CONFIG_NET_MAX_CONTEXTS=12
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_ZVFS_EVENTFD_MAX=6
CONFIG_ZVFS_OPEN_MAX=32
CONFIG_ZVFS_POLL_MAX=12
# Previously trimmed to 6/6/6/6 (128B/buf) to reclaim SRAM for the BT
# controller heap, on the assumption NET_SOCKETS_OFFLOAD bypasses Zephyr's
# net_buf pool for WiFi traffic. Confirmed wrong on hardware: esp32_wifi's own
# RX path allocates from this pool regardless of socket offload (offload only
# moves the socket *API*, not the driver's frame RX) — 6 buffers of 128B
# starve immediately under any real traffic ("Failed to allocate net
# buffer"). esp32s3_super_mini (a board that runs full native, no offload)
# independently hit the same wall and settled on RX24/TX32/256B; using
# similar values here since the underlying driver constraint is identical.
CONFIG_NET_BUF_RX_COUNT=24
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_PKT_RX_COUNT=12
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_DATA_SIZE=256
# Overflowed internal DRAM by ~5.5KB at these pool sizes; PSRAM is only ~78%
# used, so move WiFi/net stack allocations there instead of shrinking pools.
CONFIG_ESP32_WIFI_NET_ALLOC_SPIRAM=y


###############################################################################
# HID
# ── disable BT HID:  CONFIG_AKIRA_BT_HID=n
# ── disable all HID: CONFIG_AKIRA_HID=n
###############################################################################
CONFIG_AKIRA_HID=y
CONFIG_AKIRA_HID_MODE_KB_MOUSE=y
CONFIG_AKIRA_HID_MODE_GAMEPAD=n
CONFIG_AKIRA_BT_HID=y
CONFIG_AKIRA_HID_MAX_ACTIONS=16

###############################################################################
# BLE Companion service — phone / web-app remote management (device info, apps,
# settings, files, OTA). Mutually exclusive with BT HID at runtime; the active
# mode is chosen from Settings → Bluetooth → BLE Mode, or the `btmode` shell
# command (persists to NVS + reboots). Deps (BT/BT_PERIPHERAL/BT_GATT_DYNAMIC_DB)
# are already enabled above. Large transfer buffers live in PSRAM (.ext_ram.bss).
###############################################################################
CONFIG_AKIRA_BT_COMPANION=y
CONFIG_AKIRA_BT_COMPANION_STATUS_INTERVAL_MS=60000
CONFIG_AKIRA_BT_COMPANION_MAX_TRANSFER_KB=512

###############################################################################
# USB HID — keyboard/mouse (Report ID 1/2) + vendor raw (ID 3) + FIDO/U2F (ID 4)
# Stack sizes reduced to ESP32-S3 defaults; UDC buffer pool trimmed for HID-only use.
# Combined with stack reductions above this frees ~10 KB vs the previous config.
###############################################################################
CONFIG_UDC_DWC2_STACK_SIZE=2048
CONFIG_USBD_THREAD_STACK_SIZE=2048
CONFIG_AKIRA_USB=y
CONFIG_AKIRA_USB_MSC=y
CONFIG_AKIRA_USB_HID=y
CONFIG_USBD_LOG_LEVEL_INF=n
CONFIG_USBD_HID_LOG_LEVEL_INF=n
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=n


###############################################################################
# Bus controllers
# ── disable SPI: CONFIG_SPI=n
# ── disable I2C: CONFIG_I2C=n
###############################################################################
CONFIG_SPI=y
CONFIG_I2C=y
CONFIG_SENSOR=y


###############################################################################
# Display — NOT CONNECTED on this unit
# ── Option A (ST7789V):  set DISPLAY=y MIPI_DBI=y ST7789V=y MIPI_DBI_SPI=y
# ── Option B (ILI9341):  set DISPLAY=y AKIRA_ILI9341_DRIVER=y
#                         CMakeLists auto-appends *_ili9341.overlay
# ── Option C (Sharp):    set AKIRA_SHARP_DISPLAY=y LS0XX=y
###############################################################################
CONFIG_DISPLAY=y
CONFIG_MIPI_DBI=y
CONFIG_MIPI_DBI_SPI=y
CONFIG_ST7789V=y
CONFIG_LS0XX=n
CONFIG_AKIRA_SHARP_INVERT_COLORS=n


###############################################################################
# Display backlight — LP5817DRLR (U7), I2C addr 0x2D
#
# VERIFIED AGAINST THE SCHEMATIC (HWAkiraConsole/DISP.kicad_sch + .kicad_pcb):
# this board has NO PWM backlight GPIO.  The panel's three backlight LED
# strings (J7 pins 5/6/7) are current-sunk by the LP5817 on I2C0:
#   U7.1 SCL -> I2C0 SCL   U7.4 VCC -> +3.3V   U7.8 OUT0 -> J7.5
#   U7.2 SDA -> I2C0 SDA   U7.3 GND            U7.7 OUT1 -> J7.7
#                                              U7.6 OUT2 -> J7.6
#
# The LP5817 powers up with every register at 0x00 (CHIP_EN clear), so the
# panel is completely dark until src/drivers/display/lp5817.c enables it.
# This was the root cause of the "ST7789V does not work" black screen: the
# display driver, SPI transfers and GRAM writes were all healthy the whole
# time, but nothing ever turned the backlight on.
#
# The earlier "AP2502 EN via GPIO46/GPIO48 + RK10J12R0A0B brightness wheel"
# description does not match this hardware revision.  GPIO46 is LED.ACT (the
# green activity LED D9); GPIO42 is EXT_INT on J5.
###############################################################################
CONFIG_AKIRA_LP5817=y
CONFIG_I2C=y

###############################################################################
# Input — buttons via gpio-keys (no rotary dial fitted on this revision)
###############################################################################
CONFIG_INPUT=y
CONFIG_AKIRA_PWM_DIAL=n
CONFIG_AKIRA_WASM_INPUT=y
CONFIG_AKIRA_INPUT_API=y
###############################################################################
# SD Card — SPI2 CS2 (GPIO14, SD_CS)
# Molex 503398-1892 holder.  Card detect (SD_DET) via TCA6408 P5 when fitted.
# AKIRA_SD_CARD auto-selects DISK_ACCESS + FAT_FILESYSTEM_ELM via Kconfig.
# AKIRA_APP_SOURCE_SD: load WASM apps from SD card.
# AKIRA_SD_XIP:        execute WASM bytecode directly from SD (XIP mode).
# ── disable: CONFIG_AKIRA_SD_CARD=n
###############################################################################
CONFIG_AKIRA_SD_CARD=y
CONFIG_AKIRA_SD_HOTPLUG=y
CONFIG_AKIRA_APP_SOURCE_SD=y
CONFIG_AKIRA_SD_XIP=y
CONFIG_AKIRA_WASM_FS=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_MAX_LFN=127
# Disable the `fs` subsys shell (prj.conf enables it): it mounts its own FAT
# context + LFN buffer (~1 KB internal DRAM). sd_card.c uses the FS API directly
# so no functionality is lost — only the interactive `fs ...` shell commands.
CONFIG_FILE_SYSTEM_SHELL=y


###############################################################################
# TCA6408ARSV — I2C GPIO expander — FITTED
# DTS compatible "nxp,pca9538" + status="okay" in overlay →
# DT_HAS_NXP_PCA9538_ENABLED=y → GPIO_PCA_SERIES driver auto-selected.
# SPI2 cs-gpios reference expander pins (P0–P7).
###############################################################################
CONFIG_GPIO_PCA_SERIES=y


###############################################################################
# IMU — LSM6DS3 (I2C 0x6A, INT1→GPIO1)
# ── disable: CONFIG_AKIRA_LSM6DS3_DRIVER=n
###############################################################################
CONFIG_AKIRA_LSM6DS3_DRIVER=y


###############################################################################
# Environmental sensor — BME280 (I2C 0x77, optional)
# ── disable: CONFIG_BME280=n
###############################################################################
CONFIG_BME280=y


###############################################################################
# Battery charger — BQ25601RTW (I2C addr 0x6B, Zephyr charger API)
# CHARGER subsystem + BQ25601 driver enabled via DT_HAS_TI_BQ25601_ENABLED.
# Reports status/online/fault; sets ICHG and VREG from DTS defaults at boot.
###############################################################################
CONFIG_CHARGER=y
CONFIG_CHARGER_BQ25601=y


###############################################################################
# Secure element — NXP EdgeLock SE050C1HQ1/Z01SCZ (I2C addr 0x48)
# Rev A.3 replaces the Rev 1.2 ST25DV64K NFC tag. Talks T=1' over I2C; ENA on
# GPIO21 (former NFC_INT) power-gates it for deep sleep. Provides on-die TRNG,
# non-exportable P-256 keys (U2F), and secure object storage.
#  • SETTINGS_KEY: back the NVS AES-256 key with an SE050 object (TRNG-seeded).
#  • U2F:          expose hardware-backed non-exportable P-256 to WASM apps.
#  • SCP03:        off — plain APDU session (needs provisioned keys to enable).
# The legacy ST25DV driver stays in-tree but unused (its DT node is removed).
###############################################################################
# ST25DV not populated on Rev A.3 — DT node removed, driver stays in-tree unused.
CONFIG_AKIRA_ST25DV=n
CONFIG_AKIRA_SE050=n
CONFIG_AKIRA_SE050_SETTINGS_KEY=n
CONFIG_AKIRA_SE050_U2F=n
CONFIG_AKIRA_SE050_SCP03=n


###############################################################################
# RF — LR2021IMLTRT LoRa transceiver (SPI2, CS via TCA6408 P6)
# CS (LR_CS, P6), RST (RF_RST, P4), BUSY (LR_BUSY, P5) via TCA6408 expander.
# LR_INT (DIO5) → GPIO48 direct.
# ── enable: CONFIG_AKIRA_MODULE_RF=y  CONFIG_AKIRA_RADIO_MANAGER=y  CONFIG_AKIRA_LR2021=y
#            Also requires TCA6408 enabled (see TCA6408 section above).
###############################################################################
CONFIG_AKIRA_LR2021=n
CONFIG_AKIRA_RF_FRAMEWORK=y
CONFIG_AKIRA_MODULE_RF=y
CONFIG_AKIRA_RADIO_MANAGER=y


###############################################################################
# RF — CC1121RHB Sub-GHz transceiver (SPI2, CS via TCA6408 P3)
# Covers 315/433/868/915 MHz bands; default config: 868 MHz 2-FSK 4800 bps.
# Shared RF_RST with LR2021 via TCA6408 P4.
# ── enable: CONFIG_AKIRA_MODULE_RF=y  CONFIG_AKIRA_RADIO_MANAGER=y
#            CONFIG_AKIRA_CC1121=y  (also requires TCA6408 enabled)
###############################################################################
CONFIG_AKIRA_CC1121=y

###############################################################################
# Fuel gauge — STC3115AIQT (U4, I2C 0x70)
#
# VERIFIED AGAINST THE SCHEMATIC: the part fitted is an ST STC3115, not the
# TI BQ28Z610 the DTS previously declared at 0x55 (nothing ACKs there — a live
# i2c scan shows 0x70).  Current is sensed across R16 (10 mOhm) on J9 pin 3.
#
# power_manager.c binds it via the Zephyr fuel_gauge API and the OS shell home
# screen renders the level in the status bar (akira_pm_get_battery_level()).
# With no cell on J9 the gauge is unpowered, get_prop returns -ENODEV and the
# status bar simply hides the gauge.
###############################################################################
CONFIG_FUEL_GAUGE=y
CONFIG_FUEL_GAUGE_STC3115=y
CONFIG_AKIRA_POWER_MANAGER=y
CONFIG_AKIRA_POWER_DEEP_SLEEP=y
# CONFIG_POWEROFF compiles sleep_gpio/event/console/modem/cpu companion files
# that sleep_modes.c references. Avoids undefined-reference linker errors when
# esp_deep_sleep_start() is called from wait_screen_prepare_deep_sleep().
#
# Deliberately NOT CONFIG_PM=y.  CONFIG_TICKLESS_KERNEL is already =y on this
# board (an earlier version of this comment claimed otherwise), and Zephyr's
# ESP32-S3 PM backend adds nothing on top of it:
#   - pm_state_set() for PM_STATE_STANDBY is literally `waiti 0` — identical to
#     what arch_cpu_idle() already does (soc/espressif/esp32s3/power.c).
#   - The kernel timebase here is CONFIG_XTENSA_TIMER (CCOMPARE/CCOUNT); nothing
#     compensates it across esp_light_sleep_start(), and the S3 is excluded from
#     drivers/timer/esp32_sys_timer.c.  Time would simply stop.
#   - Light sleep power-gates VDD_SDIO, which would destroy .ext_ram.* — and on
#     this board that includes executable code and rodata (SPIRAM_RODATA=y,
#     SPIRAM_FETCH_INSTRUCTIONS=y).
#   - CONFIG_MAC_BB_PD costs ~4 KB DRAM; there is well under 1 KB free.
# No ESP32 bus/GPIO/SPI/I2C/UART driver in Zephyr 4.3 implements PM_DEVICE
# either, so pm_device_action_run() on them returns -ENOSYS.
CONFIG_POWEROFF=y
# PM_DEVICE *without* PM: no system power states, just the ability to call
# pm_device_action_run() by hand on the few peripherals that implement it
# (the LSM6DS3 IMU and the BME280).  akira_pm_notify_blank() uses this to power
# both down while the screen is off.  This does NOT pull in the SoC PM backend
# rejected above.
CONFIG_PM_DEVICE=y

###############################################################################
# Secure element / NFC — see the SE050 section above.
# Rev A.3 swapped the ST25DV64K NFC tag for the SE050C1HQ1 secure element
# (DTS node se050@48, compatible "nxp,se050"). Contactless/U2F now uses an
# external NFC antenna (Ezurio 0600-00061) driven by the SE050.
###############################################################################


###############################################################################
# USB-C PD controller — FUSB302BMPX (I2C addr 0x22)
# DTS node declared in board DTS: fusb302@22 (compatible "fcs,fusb302").
# CONFIG_USBC_TCPC_FUSB302 does not exist in this Zephyr tree (only
# onnn,fusb307 has a TCPC driver here, and it isn't register-compatible) —
# that line below was aspirational and never worked. AkiraOS's own minimal
# driver (src/drivers/usbc/fusb302_vbus.c) polls STATUS0.VBUSOK directly
# instead, since the dwc2 UDC can't detect VBUS itself on this SoC.
###############################################################################
CONFIG_AKIRA_FUSB302_VBUS=y


###############################################################################
# Battery charger — BQ25601RTW (I2C addr 0x6B)
# DTS node declared in board DTS: bq25601@6b (compatible "ti,bq25601").
# PWR_INT → GPIO3.  PSEL pulled HIGH → 500 mA default input current limit.
# No Zephyr upstream driver.  Accessed via WASM I2C API.
###############################################################################


###############################################################################
# Watchdog
# ── disable: CONFIG_WATCHDOG=n  CONFIG_AKIRA_WDT=n
###############################################################################
CONFIG_WATCHDOG=y
CONFIG_AKIRA_WDT=y
CONFIG_AKIRA_WASM_WDT=y


###############################################################################
# ADC — adc1 SAR ADC
# ── disable: CONFIG_ADC=n  CONFIG_AKIRA_WASM_ADC=n
###############################################################################
CONFIG_ADC=y
CONFIG_AKIRA_WASM_ADC=y
CONFIG_AKIRA_WASM_ADC_VREF_MV=3300
CONFIG_AKIRA_WASM_ADC_RESOLUTION=12


###############################################################################
# Init-priority: SPI at 75 so TCA6408 (priority 70) is ready before SPI2.
# Required because SPI2 cs-gpios reference TCA6408 P6 (LR_CS) and P3 (CC_CS).
###############################################################################
CONFIG_SPI_INIT_PRIORITY=75


###############################################################################
# WAMR / WASM runtime heap (PSRAM via MEMC)
###############################################################################
CONFIG_WAMR_HEAP_SIZE=1048576
# One WASM container at a time — frees ~9 KB internal SRAM for the BT
# controller heap (bt_enable was failing with -ENOMEM). Apps still run, just
# not two simultaneously.
CONFIG_MAX_CONTAINERS=1


###############################################################################
# WASM API surface
# ── disable individually with =n to trim binary
###############################################################################
CONFIG_AKIRA_WASM_TIMER=y
CONFIG_AKIRA_WASM_INPUT=y
CONFIG_AKIRA_WASM_I2C=y
CONFIG_AKIRA_WASM_HID=y
CONFIG_AKIRA_WASM_NET=y
CONFIG_AKIRA_NET_MAX_STREAMS=4
CONFIG_AKIRA_NET_POLL_STACK_SIZE=4096
CONFIG_AKIRA_NET_EVENT_QUEUE_DEPTH=16
CONFIG_AKIRA_WASM_BLE=y

# WASM CONFIGS (enable to export api)
CONFIG_AKIRA_WASM_FS=y
CONFIG_AKIRA_WASM_SETTINGS=y
CONFIG_AKIRA_WASM_RTC=y
CONFIG_AKIRA_WASM_TIMER=y
CONFIG_AKIRA_WASM_PWM=y
CONFIG_AKIRA_WASM_UART=y
CONFIG_AKIRA_WASM_CRYPTO=y
CONFIG_AKIRA_WASM_CRYPTO_ED25519=y
# OFF: the RFC 8032 known-answer self-test costs ~8.3 s of CPU and runs on
# every boot — including every wake from deep sleep, where it is the entire
# reason the console seems unresponsive after pressing HOME. The vendored
# SHA-512/Ed25519 code is static, so one validated build is enough; re-enable
# when touching crypto code.
CONFIG_AKIRA_CRYPTO_ED25519_SELFTEST=n
CONFIG_AKIRA_WASM_CRYPTO_ECDSA_P256=y
CONFIG_AKIRA_WASM_OTA=y
CONFIG_AKIRA_WASM_API=y
CONFIG_AKIRA_INPUT_API=y
CONFIG_AKIRA_WASM_INPUT=y
CONFIG_AKIRA_SD_CARD=y
CONFIG_AKIRA_APP_SOURCE_SD=y
CONFIG_AKIRA_SD_XIP=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_MAX_LFN=127
CONFIG_AKIRA_SYSTEM_API=y


CONFIG_AKIRA_HTTP_DEV_UPLOAD=y
# OTA data pipe trimmed 8192→2048 (streaming buffer) to reclaim SRAM for the BT
# controller heap. HTTP server stack kept at the default 8192 — the app-install
# / OTA-upload handlers run in this thread and 4096 overflowed it (fatal).
CONFIG_AKIRA_OTA_DATA_PIPE_SIZE=2048

###############################################################################
# IPC
###############################################################################
CONFIG_AKIRA_IPC_MSG_MAX_SIZE=256
CONFIG_AKIRA_IPC_QUEUE_DEPTH=4


###############################################################################
# WASM settings API
###############################################################################
CONFIG_AKIRA_WASM_SETTINGS=y

###############################################################################
# AkiraConsole OS Shell (native C UI — replaces WASM akira_shell)
###############################################################################
CONFIG_AKIRA_OS_SHELL=y
CONFIG_AKIRA_BOOT_SHELL=n
CONFIG_AKIRA_OS_VERSION="1.6.2"
CONFIG_AKIRA_INPUT_API=y
# MUST match the active panel's pixel width, otherwise the native OS shell
# lays out a frame wider than the framebuffer stride and the UI is cropped:
#   400 → Sharp LS027B7DH01 (Option C)
#   320 → ST7789V (Option A) / ILI9341 (Option B)
CONFIG_AKIRA_OS_SHELL_SCREEN_W=320

###############################################################################
# Akira subsystems
###############################################################################
CONFIG_AKIRA_BT_ECHO=n
CONFIG_AKIRA_EMBEDDED_WEB=y
# CONFIG_AKIRA_FONTS_IN_PSRAM uses .ext_ram.rodata which the Zephyr ESP32-S3
# linker template lacks. Redundant: CONFIG_SPIRAM_RODATA=y already maps all
# .rodata to PSRAM at boot without an explicit section annotation.
CONFIG_AKIRA_FONTS_IN_PSRAM=n
CONFIG_AKIRA_FRAMEBUFFER_IN_PSRAM=y


###############################################################################
# Logging
###############################################################################
CONFIG_LOG_MODE_IMMEDIATE=y
# Default 1024 bytes overflows and silently drops lines under any bursty
# hot path (e.g. mesh app-chunk transfer: 3 log lines/chunk, chunks a few
# tens of ms apart) — "--- N messages dropped ---" markers, real data loss
# when debugging exactly the kind of burst you'd want logs for.
CONFIG_LOG_BUFFER_SIZE=4096
# Akira modules at WRN, not INF.  With LOG_MODE_IMMEDIATE the *calling* thread
# blocks in the UART ISR for the whole line (~7 ms for 80 chars @115200), and
# there are LOG_INF calls on hot paths (per-keypress in the OS shell, per-packet
# in the RF daemon).  On a battery-powered build that is real CPU-active time
# spent formatting strings nobody reads.  Raise back to 3 for bring-up.
CONFIG_AKIRA_LOG_LEVEL=3
# SD card debug — uncomment if needed:
# CONFIG_SDHC_LOG_LEVEL_DBG=y

###############################################################################
# Production debug savings — disable monitoring overhead not needed in field
# Note: THREAD_MONITOR/THREAD_STACK_INFO cannot be forced =n here because
# prj.conf enables them and select chains override =n assignments (Kconfig
# aborts on the conflict). Disable the selecting feature (e.g. TRACING) to
# actually suppress them.
###############################################################################
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_SYS_HEAP_RUNTIME_STATS=y
# CONFIG_SD_LOG_LEVEL_DBG=y
CONFIG_STREAM_FLASH_INSPECT=n

###############################################################################
# Settings subsystem — value length
###############################################################################
CONFIG_AKIRA_SETTINGS_MAX_VALUE_LEN=192

###############################################################################
# AkiraMesh — DISABLED on this board: it does not fit alongside BT + WiFi.
#
# Internal DRAM is 313 KB and cannot be extended (PSRAM cannot back the BLE
# controller heap, net_buf pools or thread stacks). Measured costs:
#   BT + WiFi + mesh, heap 59392 -> 99.72% DRAM, 912 B free   (heap too small)
#   BT + WiFi,        heap 74752 -> 98.23% DRAM, 5672 B free  (this config)
# Mesh costs ~20 KB even after trimming its MAC queues to 4 deep and the
# app-distribution bitmap to a 64 B stride floor, which is more than the
# headroom the BLE controller needs to enable at all.
#
# To run the mesh RF test rig, build with CONFIG_BT=n CONFIG_WIFI=n and set
# CONFIG_AKIRA_MESH=y + CONFIG_HEAP_MEM_POOL_SIZE=59392.
# prj.conf sets AKIRA_MESH_E2E_CRYPTO=y, which has no effect without this.
###############################################################################
CONFIG_AKIRA_MESH=y
# DRAM budget: BT + WiFi together leave no room for the default mesh MAC
# queues. Each lane entry is a full struct mac_frame (256 B payload + header),
# so 4 lanes x 8 deep cost ~8.7 KB of internal DRAM. Halving the depth frees
# ~4.3 KB and only reduces burst buffering, not throughput or reachability.
CONFIG_AKIRA_MESH_MAC_TXQ_CRITICAL_LEN=4
CONFIG_AKIRA_MESH_MAC_TXQ_HIGH_LEN=4
CONFIG_AKIRA_MESH_MAC_TXQ_MEDIUM_LEN=4
CONFIG_AKIRA_MESH_MAC_TXQ_LOW_LEN=4

CONFIG_AKIRA_WASM_RUNTIME=y

# Settings encryption init is unreliable on freshly-erased flash — disabled
# until root-caused. Unrelated to the display pipeline below.
CONFIG_AKIRA_SETTINGS_ENCRYPTION=n

###############################################################################
# SPI2 GDMA + compositor thread + interrupt-mode SPI completion + input
# patches. Must ship together — board hangs if only some of these are present.
###############################################################################
CONFIG_DMA=y
CONFIG_DMA_ESP32_MAX_DESCRIPTOR_NUM=2

CONFIG_USBD_MSC_STACK_SIZE=2048
CONFIG_USB_HOST_STACK=y
CONFIG_UHC_DWC2=y
# Default 512B overflows on the connect-event call chain (port_reset ->
# submit_new_device -> uhc_submit_event) on Xtensa's register-windowed ABI.
CONFIG_UHC_DWC2_STACK_SIZE=2048
# usbh_bus runs dev_connected_handler -> usbh_class_probe_device ->
# usbh_msc_probe (SCSI/BBB) -> fs_mount; 2048 overflows this chain.
CONFIG_USBH_STACK_SIZE=4096
# Off: the `usbh` shell is a bring-up console for raw control transfers and
# its vendor-request scratch buffer is a flat 1 KB of internal DRAM.
# Mass storage attaches through usbh_msc without it.
CONFIG_USBH_SHELL=n
# One USB-A port, no hub: 2 is the Kconfig minimum. The default of 4 sizes a
# 4 x 592 B device slab in internal DRAM for devices this board cannot attach.
CONFIG_USBH_USB_DEVICE_MAX=2
CONFIG_AKIRA_USB_STORAGE_HOST=y
# FF_VOLUMES defaults to 1, so every FatFs diskio call (SD included) routes
# through disk name "RAM" regardless of mount point text. Entries must be
# bare names with NO trailing ':' (see usbh_msc.h's USBH_MSC_DISK_NAME).
CONFIG_FS_FATFS_CUSTOM_MOUNT_POINT_COUNT=2
CONFIG_FS_FATFS_CUSTOM_MOUNT_POINTS="SD,USB"
# TEST-ONLY: UDC and UHC dwc2 both bind the same devicetree node (single
# physical OTG core) — compiling both in shadows the UDC device struct onto
# usbh_init(), crashing it. Disabling UDC isolates the host driver for
# bring-up testing. Revert before merging.
CONFIG_UDC_DWC2=y


###############################################################################
# App thread stacks — sized from `kernel thread stacks` peaks measured on
# hardware over a session that launched several apps, served HTTP, mounted SD
# and ran the RF daemon.  Peak / new size:
#   http_server   4836 / 6656   akira_os_shell 3988 / 5632 (in source)
#   rf_rx_daemon  1844 / 3072   mesh mac tx/rx  676,356 / 2560
#   sd_event       324 / 3072 (in source)
#
# The mesh and sd_event peaks are the two to distrust: no mesh traffic and no
# card insert/remove happened during that run, so those numbers are close to
# bare thread entry. They are cut the least, and sd_event still clears the
# ~3 KB its own comment claims fs_unmount + registry ops need.
###############################################################################
CONFIG_AKIRA_HTTP_SERVER_STACK_SIZE=6656
CONFIG_AKIRA_RF_DAEMON_STACK_SIZE=3072
CONFIG_AKIRA_MESH_RX_STACK_SIZE=2560
