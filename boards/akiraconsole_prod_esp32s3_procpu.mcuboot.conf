#
# MCUboot config for AkiraConsole Prod. build.sh builds MCUboot with the board's
# AkiraOS overlay so the partition layout matches the app, and that overlay
# enables the TCA6408 I/O expander on I2C. MCUboot is single-threaded, so the
# expander driver (gpio_pca_series: k_work, k_sem) does not link. The bootloader
# needs neither the expander nor I2C (the expander driver selects I2C).
CONFIG_GPIO_PCA_SERIES=n
CONFIG_I2C=n
