# BOARD_ZEPHYR: flipper_zero
# BOARD_CHIP: stm32
# BOARD_DESC: Flipper Zero (STM32WB55RGV6, Cortex-M4 @ 64 MHz)

# =============================================================================
# Memory Configuration
# STM32WB55 total SRAM: 256 KB (SRAM1 128KB + SRAM2a 32KB + SRAM2b 32KB + SRAM6 64KB)
# BLE stack (M0+ co-processor) reserves SRAM2a (32KB) + SRAM2b (32KB) at runtime.
# Usable for M4 application: SRAM1 (128KB) + SRAM6 (64KB) = 192 KB
# =============================================================================
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024
CONFIG_IDLE_STACK_SIZE=512
CONFIG_ISR_STACK_SIZE=2048

# =============================================================================
# Core Peripherals
# =============================================================================
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_I2C=y
CONFIG_SERIAL=y
CONFIG_PINCTRL=y
CONFIG_PWM=y
CONFIG_ADC=y
CONFIG_COUNTER=y
CONFIG_ENTROPY_GENERATOR=y

# =============================================================================
# Bluetooth (STM32WB55 M0+ co-processor BLE 5.0)
# NOTE: Requires pre-flashing STM32WB wireless binary before first use.
#       Flash stm32wb5x_BLE_HCILayer_extended_fw.bin with STM32CubeProgrammer:
#         STM32_Programmer_CLI -c port=SWD -w <binary> 0x080CE000
# =============================================================================
CONFIG_BT=y
CONFIG_BT_HCI=y
# BT_STM32_IPM is auto-selected by the SoC Kconfig when BT=y on STM32WBx
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_DEVICE_NAME="AkiraOS-FlipperZero"
CONFIG_BT_DEVICE_APPEARANCE=0
CONFIG_BT_MAX_CONN=2
CONFIG_AKIRA_WASM_BLE=y

# =============================================================================
# Sub-GHz RF (CC1101 via SPI1)
# Flipper Zero covers 300–928 MHz bands
# =============================================================================
CONFIG_AKIRA_MODULE_RF=y
CONFIG_AKIRA_RF_FRAMEWORK=y
CONFIG_AKIRA_CC1101=y

# =============================================================================
# Display (ST7565 128x64 monochrome LCD via SPI1)
# =============================================================================
CONFIG_DISPLAY=y
CONFIG_SSD1306=y
CONFIG_AKIRA_DISPLAY=y

# =============================================================================
# Input (6 buttons: UP, DOWN, LEFT, RIGHT, OK, BACK)
# =============================================================================
CONFIG_INPUT=y
CONFIG_INPUT_GPIO_KEYS=y

# =============================================================================
# USB (STM32WB55 USB 2.0 Full-Speed on PA11/PA12)
# Using new USB device stack (NEXT) — required by AkiraOS usb_manager.c
# which uses USBD_DEVICE_DEFINE and DT_NODELABEL(zephyr_udc0).
CONFIG_USB_DEVICE_STACK=n
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_UART_LINE_CTRL=y
CONFIG_AKIRA_USB=y

# =============================================================================
# IR Transmitter (PWM on PA10 via TIM1 CH3 — configured in DTS)
# IR carrier waveform generation is done via pwm_ir node; no extra Kconfig needed.

# =============================================================================
# File System & Storage
# =============================================================================
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_AKIRA_APP_SOURCE_SD=n

# =============================================================================
# Bootloader / OTA (MCUboot)
# =============================================================================
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_MCUBOOT_SIGNATURE_KEY_FILE="bootloader/mcuboot/root-rsa-2048.pem"
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_IMG_BLOCK_BUF_SIZE=512

# =============================================================================
# Networking — disabled (no WiFi hardware on Flipper Zero)
# Connectivity is via BLE + sub-GHz CC1101 only
# =============================================================================
CONFIG_WIFI=n
CONFIG_NET_L2_ETHERNET=n
CONFIG_AKIRA_HTTP_SERVER=n
CONFIG_SHELL_BACKEND_TELNET=n
CONFIG_WEBSOCKET_CLIENT=n

# =============================================================================
# NFC — deferred (ST25R3916 active NFC reader requires out-of-tree driver)
# CONFIG_AKIRA_NFC is not yet defined in AkiraOS Kconfig; placeholder for future use.

# =============================================================================
# App Management (constrained by available SRAM)
# =============================================================================
CONFIG_AKIRA_APP_MAX_INSTALLED=4
CONFIG_AKIRA_APP_MAX_RUNNING=2
CONFIG_MAX_CONTAINERS=4
CONFIG_WAMR_HEAP_SIZE=16384
CONFIG_AKIRA_WASM_APP_STACK_SIZE=4096

# =============================================================================
# Shell & Logging (size optimisations for constrained SRAM)
# =============================================================================
CONFIG_SHELL_HISTORY=y
CONFIG_SHELL_CMD_BUFF_SIZE=128
CONFIG_SHELL_TAB_AUTOCOMPLETION=y
CONFIG_LOG_BUFFER_SIZE=1024
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=512

# =============================================================================
# Crypto (hardware AES-256 + TRNG on STM32WB55)
# =============================================================================
CONFIG_CRYPTO=y
CONFIG_CRYPTO_STM32=y
CONFIG_MBEDTLS=y
CONFIG_AKIRA_SETTINGS_ENCRYPTION=y

# =============================================================================
# Miscellaneous
# =============================================================================
CONFIG_ARM_MPU=y
CONFIG_HW_STACK_PROTECTION=y
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_REBOOT=y

# =============================================================================
# WASM / WAMR — disabled on Flipper Zero (flash budget ~400 KB after OTA slots)
# WAMR interpreter alone is ~150 KB; re-enable once a smaller interpreter or
# AOT compilation path is validated for STM32WB55.
# =============================================================================
CONFIG_AKIRA_WASM_RUNTIME=n
