description: Semtech LR2021 LoRa/GFSK transceiver

compatible: "semtech,lr2021"

include: spi-device.yaml

properties:
  cs-gpios:
    type: phandle-array
    required: true
    description: |
      GPIO pin used for SPI chip select (NSS).
      This transceiver requires manual CS control.

  reset-gpios:
    type: phandle-array
    required: true
    description: |
      GPIO pin connected to NRESET pin.
      Active low reset signal.

  busy-gpios:
    type: phandle-array
    required: true
    description: |
      GPIO pin connected to BUSY pin.
      Used to poll command completion status.
      Should be configured with pull-down resistor.

  irq-gpios:
    type: phandle-array
    required: false
    description: |
      GPIO pin connected to IRQ pin (optional).
      Can be used for interrupt-driven operation.

  spi-max-frequency:
    type: int
    required: true
    description: |
      Maximum SPI frequency in Hz.
      LR2021 supports 1-10 MHz.

  akira,default-frequency-hz:
    type: int
    required: false
    default: 868000000
    description: |
      Default carrier frequency in Hz.
      Used if not changed at runtime via SetRfFrequency.

  akira,default-bitrate-bps:
    type: int
    required: false
    default: 4800
    description: |
      Default FSK bitrate in bits per second.
      Used if not changed at runtime via SetBitrate.
